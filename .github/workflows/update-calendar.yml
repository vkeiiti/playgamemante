name: Update game maintenance calendar
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python generate_calendar.py
      - name: Commit calendar if changed
        run: |
          git config user.name "game-maintenance-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update game maintenance calendar"
            git push
          fi
