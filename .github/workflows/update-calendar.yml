name: Update game maintenance calendar

on:
  schedule:
    # Once per hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Commit calendar if changed
        run: |
          git config user.name "game-maintenance-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f calendar.ics ]; then
            echo "calendar.ics was not generated because no safe events were found."
            echo "Keeping the existing calendar unchanged."
            exit 0
          fi

          git add calendar.ics
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update game maintenance calendar"
            git push
          fi
